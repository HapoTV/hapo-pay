<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            background: #1a1a2e;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
        }

        .body {
            padding: 32px;
            color: #333333;
        }

        .body p {
            line-height: 1.6;
        }

        .amount {
            font-size: 32px;
            font-weight: bold;
            color: #1a1a2e;
            text-align: center;
            margin: 24px 0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .detail-label {
            color: #888888;
            font-size: 14px;
        }

        .detail-value {
            font-weight: bold;
            font-size: 14px;
        }

        .button {
            display: block;
            width: fit-content;
            margin: 24px auto;
            padding: 12px 32px;
            background: #1a1a2e;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .footer {
            background: #f4f4f4;
            padding: 16px;
            text-align: center;
            color: #888888;
            font-size: 12px;
        }

        .alert-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 16px;
            margin: 16px 0;
        }

        .success-box {
            background: #d4edda;
            border: 1px solid #28a745;
            border-radius: 6px;
            padding: 16px;
            margin: 16px 0;
        }

        .danger-box {
            background: #f8d7da;
            border: 1px solid #dc3545;
            border-radius: 6px;
            padding: 16px;
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>HapoPay</h1>
        </div>
        <div class="body">
            {% block content %}
            {% endblock %}
        </div>
        <div class="footer">
            <p>© 2026 HapoPay. All rights reserved.</p>
            <p>This is an automated message. Please do not reply.</p>
        </div>
    </div>
</body>
</html>
