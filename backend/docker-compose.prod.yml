# docker-compose.prod.yml
version: '3.8'

services:
  web:
    build: .
    container_name: hapopay-backend-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=hapopay.settings
      - DEBUG=False
    env_file:
      - .env.prod
    volumes:
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - redis
      - postgres
    networks:
      - hapopay-network
    command: gunicorn hapopay.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120

  postgres:
    image: postgres:15-alpine
    container_name: hapopay-postgres
    restart: always
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hapopay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hapopay-redis-prod
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - hapopay-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  celery:
    build: .
    container_name: hapopay-celery-prod
    restart: always
    command: celery -A hapopay worker --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=hapopay.settings
      - DEBUG=False
    env_file:
      - .env.prod
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - hapopay-network

  celery-beat:
    build: .
    container_name: hapopay-celery-beat-prod
    restart: always
    command: celery -A hapopay beat --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=hapopay.settings
      - DEBUG=False
    env_file:
      - .env.prod
    depends_on:
      - redis
      - celery
    networks:
      - hapopay-network

  nginx:
    image: nginx:alpine
    container_name: hapopay-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - hapopay-network

volumes:
  postgres-data:
  redis-data:

networks:
  hapopay-network:
    driver: bridge