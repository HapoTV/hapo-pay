# docker-compose.yml
version: '3.8'

services:
  # Django Backend Application
  web:
    build: .
    container_name: hapopay-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # DEBUG is intentionally NOT set here. It used to be hardcoded to 1 in
      # all three services, which silently overrode whatever .env said -- so a
      # stack brought up with a production-shaped .env still ran with full
      # tracebacks, and the security settings gated on `if not DEBUG` (secure
      # cookies, HSTS, SSL redirect) were all switched off. Let .env decide.
      - DJANGO_SETTINGS_MODULE=hapopay.settings
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - redis
    networks:
      - hapopay-network
    healthcheck:
      # /health/ is the liveness probe: it answers without touching the
      # database or cache. This used to probe /admin/, which pulls in sessions,
      # auth and template rendering -- and whose redirect returned a success
      # status even when the database was unreachable, so the check passed for
      # a container that could not serve a single API request.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching and WebSocket
  redis:
    image: redis:7-alpine
    container_name: hapopay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hapopay-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Celery Worker for background tasks
  celery:
    build: .
    container_name: hapopay-celery
    restart: unless-stopped
    command: celery -A hapopay worker --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=hapopay.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - hapopay-network

  # Celery Beat for scheduled tasks
  celery-beat:
    build: .
    container_name: hapopay-celery-beat
    restart: unless-stopped
    command: celery -A hapopay beat --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=hapopay.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      - redis
      - celery
    networks:
      - hapopay-network

volumes:
  redis-data:

networks:
  hapopay-network:
    driver: bridge