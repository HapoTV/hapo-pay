# docker-compose.yml
version: '3.8'

services:
  # Django Backend Application
  web:
    build: .
    container_name: hapopay-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=hapopay.settings
      - PYTHONPATH=/app
      - DEBUG=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - redis
    networks:
      - hapopay-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching and WebSocket
  redis:
    image: redis:7-alpine
    container_name: hapopay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hapopay-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Celery Worker for background tasks
  celery:
    build: .
    container_name: hapopay-celery
    restart: unless-stopped
    command: celery -A hapopay worker --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=hapopay.settings
      - DEBUG=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - hapopay-network

  # Celery Beat for scheduled tasks
  celery-beat:
    build: .
    container_name: hapopay-celery-beat
    restart: unless-stopped
    command: celery -A hapopay beat --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=hapopay.settings
      - DEBUG=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      - redis
      - celery
    networks:
      - hapopay-network

volumes:
  redis-data:

networks:
  hapopay-network:
    driver: bridge