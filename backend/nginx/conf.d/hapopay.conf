# nginx/conf.d/hapopay.conf
upstream django {
    server web:8000;
}

# Edge rate limiting. There was none, so the application was the first thing
# to absorb a flood -- each request consuming a gunicorn worker and a database
# connection. Limiting here sheds load before it reaches Python.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost api.hapopay.com;

    client_max_body_size 100M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # NOTE: this server block listens on port 80 only. Strict-Transport-Security
    # is intentionally NOT set here -- browsers ignore it over plaintext, and
    # its presence hides the fact that there is no TLS listener at all. Adding
    # a real 443 block (and redirecting 80 -> 443) is a required follow-up;
    # see the audit report.

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Credential endpoints get a much tighter budget: these are the targets
    # of password spraying and enumeration.
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django application
    location / {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Edge liveness: answers even if Django is down, so it only proves nginx
    # is up. Exact-match (=) so it does NOT shadow /health/ready/ below --
    # as a prefix match it swallowed every /health/* path, making the
    # application's own readiness probe unreachable through the proxy.
    location = /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Application readiness: proxied through to Django, which checks the
    # database and cache. This is the probe a load balancer should use.
    location = /health/ready/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}