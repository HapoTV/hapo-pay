# pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = hapopay.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --reuse-db
    --cov=apps
    --cov=core
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=85
testpaths = tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    security: marks security tests